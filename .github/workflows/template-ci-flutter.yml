name: Template — CI Flutter

on:
  workflow_call:
    inputs:
      flutter_version:
        type: string
        default: '3.x'
      release_to_stores:
        type: boolean
        default: false
        description: 'Publish to Play Store and App Store after distribute gate'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/upload-keystore.jks
      - run: flutter pub get
      - run: flutter build appbundle --release
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab

  ios-codemagic:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and poll Codemagic iOS build
        run: |
          RESPONSE=$(curl -s -X POST https://api.codemagic.io/builds \
            -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"appId\":\"${{ vars.CODEMAGIC_APP_ID }}\",\"workflowId\":\"ios-release\",\"branch\":\"${{ github.ref_name }}\"}")
          BUILD_ID=$(echo $RESPONSE | jq -r '.buildId')
          echo "Codemagic Build ID: $BUILD_ID"

          for i in $(seq 1 30); do
            sleep 60
            STATUS=$(curl -s "https://api.codemagic.io/builds/$BUILD_ID" \
              -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" | jq -r '.build.status')
            echo "Status [$i/30]: $STATUS"
            [ "$STATUS" = "finished" ] && exit 0
            { [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; } && echo "iOS build $STATUS" && exit 1
          done
          echo "iOS build timed out after 30 minutes" && exit 1

  distribute:
    needs: [android-build, ios-codemagic]
    runs-on: ubuntu-latest
    environment: distribution
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle-${{ github.sha }}
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: app-release.aab
          groups: internal-testers

  store-release:
    needs: distribute
    if: ${{ inputs.release_to_stores }}
    runs-on: ubuntu-latest
    environment: store-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle-${{ github.sha }}
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: om.nama.tipms
          releaseFiles: app-release.aab
          track: production
