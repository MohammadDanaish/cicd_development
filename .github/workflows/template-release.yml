name: Template — Release & Sign

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: 'GHCR image name to version-tag and sign e.g. nama-tipms-api'
      node_version:
        type: string
        default: '20'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
      - run: npm ci

      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Re-tag and sign image
        env:
          REGISTRY: ghcr.io/nama-water
          IMAGE: ${{ inputs.image_name }}
          SHA: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Releasing $IMAGE version $VERSION"

          docker pull $REGISTRY/$IMAGE:$SHA
          docker tag $REGISTRY/$IMAGE:$SHA $REGISTRY/$IMAGE:$VERSION
          docker tag $REGISTRY/$IMAGE:$SHA $REGISTRY/$IMAGE:latest
          docker push $REGISTRY/$IMAGE:$VERSION
          docker push $REGISTRY/$IMAGE:latest

          cosign sign --yes $REGISTRY/$IMAGE:$SHA
          cosign sign --yes $REGISTRY/$IMAGE:$VERSION
